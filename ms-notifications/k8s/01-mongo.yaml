apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  labels:
    app: mongo-notification
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongo-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-notification
  template:
    metadata:
      labels:
        app: mongo-notification
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-notification-service
  labels:
    app: mongo-notification
spec:
  type: ClusterIP
  selector:
    app: mongo-notification
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
---
# Alias para compatibilidade reversa se necessário
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: mongo-notification
spec:
  type: ClusterIP
  selector:
    app: mongo-notification
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
